<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AccraRide — Branch Road Network</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:#fff}canvas#game{display:block}
.panel{position:fixed;z-index:3;background:#07131de8;border:1px solid #ffffff30;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.55;backdrop-filter:blur(8px)}#hud{top:10px;left:10px;min-width:160px}#hud b{color:#8ee7ff}#map{top:10px;right:10px;width:158px;height:158px;padding:7px}#map canvas{width:100%;height:100%}#status{position:fixed;z-index:3;top:178px;right:10px;padding:7px 10px;border-radius:9px;background:#07131de8;font-size:11px}#help{position:fixed;z-index:3;bottom:10px;left:50%;transform:translateX(-50%);background:#07131de8;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:11px;text-align:center;white-space:nowrap}

</style></head><body>
<canvas id="game"></canvas>
<div id="hud" class="panel"><b>ACCRARIDE · BRANCH ROAD TEST</b><br>Speed: <span id="speed">0</span> km/h<br>Current road: <span id="road">Central Avenue</span><br>Junction: <span id="junction">Approaching</span><br>Traffic: <span id="traffic">0</span><br>Driving: <span id="drivingState">On road</span></div>
<div id="map" class="panel"><canvas id="mapCanvas" width="300" height="300"></canvas></div><div id="status">Independent test · Production unchanged</div>
<div id="touch"><div class="pad"><button id="left">◀</button><button id="right">▶</button></div><div class="pad"><button id="brake">▼</button><button id="gas">▲</button></div></div>
<div id="help">WASD / Arrow keys or touch · Follow the connected roads and explore the branches</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9cbd8);scene.fog=new THREE.Fog(0xa9cbd8,260,760);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x52634c,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-100,160,90);sun.castShadow=true;scene.add(sun);
const material=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),material(0x738b68));ground.rotation.x=-Math.PI/2;ground.position.y=-.22;scene.add(ground);
const asphalt=material(0x30363b),lanePaint=material(0xe7e0c8),curb=material(0xc6c5b9),concrete=material(0x777d7b);
const nodes={A:[0,0,145],B:[0,0,35],C:[0,0,-85],D:[0,0,-205],E:[-125,0,35],F:[125,0,35],G:[-125,0,-205],H:[125,0,-205],I:[0,0,-330],J:[-230,0,-85],K:[230,0,-85],L:[-230,0,155],M:[230,0,155],N:[-125,0,-85],O:[125,0,-85]};
const roads=[
{id:'ab',a:'A',b:'B',name:'Central Avenue',via:[[0,0,90]]},{id:'bc',a:'B',b:'C',name:'Central Avenue',via:[[0,0,-20]]},{id:'cd',a:'C',b:'D',name:'Ring Connector',via:[[4,0,-145]]},{id:'di',a:'D',b:'I',name:'Central Avenue',via:[[0,0,-270]]},
{id:'eb',a:'E',b:'B',name:'West Branch',via:[[-65,0,35]]},{id:'bf',a:'B',b:'F',name:'East Branch',via:[[65,0,35]]},{id:'gd',a:'G',b:'D',name:'Northwest Link',via:[[-65,0,-205]]},{id:'dh',a:'D',b:'H',name:'Northeast Link',via:[[65,0,-205]]},
{id:'cj',a:'C',b:'J',name:'West Connector',via:[[-120,0,-85]]},{id:'ck',a:'C',b:'K',name:'East Connector',via:[[120,0,-85]]},
{id:'en',a:'E',b:'N',name:'West Avenue',via:[[-125,0,-25]]},{id:'nf',a:'N',b:'C',name:'West Avenue',via:[[-65,0,-85]]},{id:'co',a:'C',b:'O',name:'East Avenue',via:[[65,0,-85]]},{id:'of',a:'O',b:'F',name:'East Avenue',via:[[125,0,-25]]},
{id:'el',a:'E',b:'L',name:'Outer West Road',via:[[-190,0,95]]},{id:'fm',a:'F',b:'M',name:'Outer East Road',via:[[190,0,95]]},
// End connectors: close the previously dead-end road arms into continuous loops
{id:'al',a:'A',b:'L',name:'Southwest Loop',via:[[-65,0,190],[-175,0,190]]},
{id:'jl',a:'J',b:'L',name:'West Outer Loop',via:[[-280,0,-20],[-280,0,80]]},
{id:'km',a:'K',b:'M',name:'East Outer Loop',via:[[280,0,-20],[280,0,80]]},
{id:'ig',a:'I',b:'G',name:'Northwest Outer Loop',via:[[-90,0,-390]]},
{id:'ih',a:'I',b:'H',name:'Northeast Outer Loop',via:[[90,0,-390]]}
];
const edgeData=[];
function makeRoad(r){const pts=[new THREE.Vector3(...nodes[r.a]),...(r.via||[]).map(p=>new THREE.Vector3(...p)),new THREE.Vector3(...nodes[r.b])];const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');edgeData.push({...r,curve,length:curve.getLength()});
const samples=curve.getPoints(Math.max(24,Math.ceil(curve.getLength()/5))),verts=[],indices=[];
 // Wide compacted shoulders beneath the asphalt create a finished road profile.
 const shoulderVerts=[],shoulderIndices=[];
 for(let i=0;i<samples.length;i++){const tangent=curve.getTangent(i/(samples.length-1)).normalize(),side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();for(const offset of [-8.4,8.4]){const p=samples[i].clone().addScaledVector(side,offset);p.y=-.035;shoulderVerts.push(p.x,p.y,p.z)}}
 for(let i=0;i<samples.length-1;i++){const n=i*2;shoulderIndices.push(n,n+2,n+1,n+1,n+2,n+3)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(shoulderVerts,3));sg.setIndex(shoulderIndices);sg.computeVertexNormals();const shoulder=new THREE.Mesh(sg,material(0xaaa99b));shoulder.receiveShadow=true;scene.add(shoulder);
for(let i=0;i<samples.length;i++){const tangent=curve.getTangent(i/(samples.length-1)).normalize(),side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();for(const offset of [-6.2,6.2]){const p=samples[i].clone().addScaledVector(side,offset);p.y=.025;verts.push(p.x,p.y,p.z)}}
for(let i=0;i<samples.length-1;i++){const n=i*2;indices.push(n,n+2,n+1,n+1,n+2,n+3)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const roadMesh=new THREE.Mesh(geo,asphalt);roadMesh.receiveShadow=true;scene.add(roadMesh);
// edge strips and broken centre markings follow each curve
for(const sideSign of [-1,1]){const edgePts=samples.map((p,i)=>p.clone().addScaledVector(new THREE.Vector3(-curve.getTangent(i/(samples.length-1)).z,0,curve.getTangent(i/(samples.length-1)).x).normalize(),sideSign*5.65).setY(.09));scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(edgePts),new THREE.LineBasicMaterial({color:0xd8d5c7})))}
for(let d=8;d<curve.getLength()-5;d+=13){const t=d/curve.getLength(),p=curve.getPointAt(t),tan=curve.getTangentAt(t);const dash=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,4.5),lanePaint);dash.position.set(p.x,.105,p.z);dash.rotation.y=Math.atan2(tan.x,tan.z);scene.add(dash)}
}
roads.forEach(makeRoad);
// Junction aprons and raised curb corners
for(const [id,p] of Object.entries(nodes)){const pad=new THREE.Mesh(new THREE.BoxGeometry(14,.07,14),asphalt);pad.position.set(p[0],.035,p[2]);scene.add(pad);}
// Urban blocks placed away from the road corridors
const buildingColors=[0xc7b49d,0xb8c5c7,0xd0a77e,0x9eafb1,0xb8aa92];
for(let x=-290;x<=290;x+=34)for(let z=-360;z<=210;z+=34){let clear=false;for(const r of edgeData){const samples=r.curve.getPoints(12);for(let i=0;i<samples.length-1;i++){const a=samples[i],b=samples[i+1],dx=b.x-a.x,dz=b.z-a.z,t=THREE.MathUtils.clamp(((x-a.x)*dx+(z-a.z)*dz)/(dx*dx+dz*dz||1),0,1);if(Math.hypot(x-(a.x+t*dx),z-(a.z+t*dz))<17){clear=true;break}}if(clear)break}if(clear||Math.random()<.16)continue;const h=9+Math.random()*25,w=10+Math.random()*10;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,12+Math.random()*8),material(buildingColors[Math.floor(Math.random()*buildingColors.length)]));b.position.set(x,h/2,z);b.castShadow=true;scene.add(b)}
// Streetscape dressing: footpaths, kerbs, streetlights, trees and small roadside details.
const sidewalkMat=material(0xc1bdb0),kerbMat=material(0xe0d9c9),trunkMat=material(0x594331),leafMats=[0x47734c,0x5c8754,0x78945b].map(c=>material(c));
function addTree(x,z,scale=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*scale,.32*scale,2.4*scale,7),trunkMat);trunk.position.set(x,1.2*scale,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.8*scale,9,7),leafMats[Math.floor(Math.random()*leafMats.length)]);crown.position.set(x,3.1*scale,z);crown.scale.set(1,1.15,.95);crown.castShadow=true;scene.add(crown)}
function addStreetlight(x,z,rot=0){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,7,7),material(0x4a5355));pole.position.set(x,3.5,z);scene.add(pole);const arm=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.12),material(0x4a5355));arm.position.set(x+(rot?-.65:.65),6.75,z);scene.add(arm);const lamp=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.32),material(0xffe6a6));lamp.position.set(x+(rot? -1.3:1.3),6.65,z);scene.add(lamp)}
// Add varied rooflines and subtle window grids to give the blocks an urban Accra character.
const facadeMats=[0xd8c9ae,0xc5d0cd,0xe0d4c0,0xb5c1bd].map(c=>material(c));
for(const child of scene.children){if(child.userData.building){/* reserved for future building metadata */}}
for(let x=-285;x<=285;x+=68){for(let z=-330;z<=185;z+=68){if(Math.random()<.36)continue;let near=false;for(const r of edgeData){const p=r.curve.getPointAt(.5);if(Math.hypot(x-p.x,z-p.z)<26){near=true;break}}if(near)continue;addTree(x+(Math.random()*8-4),z+(Math.random()*8-4),.75+Math.random()*.45)}}
for(const r of edgeData){if(r.curve.length<55)continue;for(let d=32;d<r.curve.length-20;d+=68){const t=d/r.curve.length,p=r.curve.getPointAt(t),tan=r.curve.getTangentAt(t).normalize(),side=new THREE.Vector3(-tan.z,0,tan.x);const sign=Math.random()<.5?-1:1;const x=p.x+side.x*12.2*sign,z=p.z+side.z*12.2*sign;if(Math.random()<.48)addStreetlight(x,z,sign<0?1:0);else addTree(x,z,.72+Math.random()*.25)}}
// Raised, pale junction corner islands make intersections easier to read.
for(const [id,p] of Object.entries(nodes)){const island=new THREE.Mesh(new THREE.BoxGeometry(17,.13,17),sidewalkMat);island.position.set(p[0],-.015,p[2]);scene.add(island);const apron=new THREE.Mesh(new THREE.BoxGeometry(14.2,.09,14.2),asphalt);apron.position.set(p[0],.055,p[2]);scene.add(apron)}
// A few low roadside walls and drainage channels add scale without cluttering the carriageway.
for(let x=-300;x<=300;x+=60){for(const z of [-410,245]){const wall=new THREE.Mesh(new THREE.BoxGeometry(42,.45,.55),material(0x8d9188));wall.position.set(x,.22,z);scene.add(wall)}}
// Player vehicle, facing down the main avenue
const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.35,.9,4.5),material(0x087ca8,.4));body.position.y=.85;body.castShadow=true;car.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.82,.82,2.15),material(0x172b37,.25));cabin.position.set(0,1.65,-.25);car.add(cabin);const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.1,.22,.2),material(0xe7e4d5));bumper.position.set(0,.65,-2.28);car.add(bumper);
for(const x of [-.78,.78]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.18,.08),material(0xfff2c7));lamp.position.set(x,1.02,-2.28);car.add(lamp)}car.position.set(0,0,112);scene.add(car);
const traffic=[];const carMats=[0xd74d3e,0xe0b83f,0xeeeeea,0x334f70,0x4c8065].map(c=>material(c,.48));
function addTraffic(edge,reverse,t){const group=new THREE.Group(),paint=carMats[Math.floor(Math.random()*carMats.length)];const shell=new THREE.Mesh(new THREE.BoxGeometry(2.1,.85,4),paint);shell.position.y=.75;group.add(shell);const top=new THREE.Mesh(new THREE.BoxGeometry(1.65,.65,1.9),material(0x263944,.25));top.position.set(0,1.45,-.2);group.add(top);const cruise=18+Math.random()*13;const item={group,edge,reverse,t,speed:cruise,baseSpeed:cruise,previousNode:null,lane:1.75,hitCooldown:0};scene.add(group);traffic.push(item)}
const adjacency={};for(const edge of edgeData){(adjacency[edge.a]??=[]).push(edge);(adjacency[edge.b]??=[]).push(edge)}
for(const r of edgeData){if(['ab','bc','cd','di','eb','bf','cj','ck','en','of','gd','dh','nf','co','al','jl','km','ig','ih'].includes(r.id)){addTraffic(r,false,.2+Math.random()*.6);addTraffic(r,true,.2+Math.random()*.6)}}
function placeTraffic(v){const t=THREE.MathUtils.clamp(v.t,0,1),p=v.edge.curve.getPointAt(t),tan=v.edge.curve.getTangentAt(t).normalize(),direction=tan.clone().multiplyScalar(v.reverse?-1:1),side=new THREE.Vector3(-direction.z,0,direction.x);v.group.position.set(p.x+side.x*v.lane,0,p.z+side.z*v.lane);v.group.rotation.y=Math.atan2(direction.x,direction.z)}
function advanceTraffic(v,dt){let remaining=v.speed*dt/v.edge.length*(v.reverse?-1:1),guard=0;while(Math.abs(remaining)>0&&guard++<4){const next=v.t+remaining;if(next>=.985||next<=.015){const atB=next>=.985,node=atB?v.edge.b:v.edge.a;v.previousNode=node;const choices=(adjacency[node]||[]).filter(e=>e.id!==v.edge.id);if(!choices.length){v.reverse=!v.reverse;v.t=atB?.97:.03;remaining=0;break}const pick=choices[Math.floor(Math.random()*choices.length)];v.edge=pick;v.reverse=pick.b===node;v.t=v.reverse?.985:.015;remaining*=.65;}else{v.t=next;remaining=0}}placeTraffic(v)}
traffic.forEach(placeTraffic);
// Input handling
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true};const up=()=>keys[key]=false;el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}
bind('left','arrowleft');bind('right','arrowright');bind('gas','arrowup');bind('brake','arrowdown');
let speed=0,heading=0,steer=0,collisionFlash=0;const nearestInfo=()=>{let best=null,bd=Infinity,bestPoint=null;for(const r of edgeData){for(let i=0;i<=64;i++){const p=r.curve.getPointAt(i/64),d=Math.hypot(car.position.x-p.x,car.position.z-p.z);if(d<bd){bd=d;best=r;bestPoint=p}}}return {road:best,distance:bd,point:bestPoint}};
const map=document.getElementById('mapCanvas'),ctx=map.getContext('2d');function drawMap(){ctx.clearRect(0,0,300,300);ctx.fillStyle='#10212a';ctx.fillRect(0,0,300,300);const sx=x=>150+x*.48,sy=z=>150+z*.48;ctx.lineCap='round';for(const r of edgeData){const pts=r.curve.getPoints(30);ctx.strokeStyle='#69777b';ctx.lineWidth=9;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(sx(p.x),sy(p.z)):ctx.moveTo(sx(p.x),sy(p.z)));ctx.stroke();ctx.strokeStyle='#e1d9bd';ctx.lineWidth=1.3;ctx.stroke()}for(const p of Object.values(nodes)){ctx.fillStyle='#f0c66a';ctx.beginPath();ctx.arc(sx(p[0]),sy(p[2]),3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#20d5ff';ctx.beginPath();ctx.arc(sx(car.position.x),sy(car.position.z),5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#20d5ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(car.position.x),sy(car.position.z));ctx.lineTo(sx(car.position.x-Math.sin(heading)*14),sy(car.position.z-Math.cos(heading)*14));ctx.stroke()}
const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);const forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;
if(forward)speed+=24*dt;else if(back)speed-=48*dt;else speed-=Math.sign(speed)*7*dt;speed=THREE.MathUtils.clamp(speed,-10,48);
steer=THREE.MathUtils.damp(steer,(left?1:0)-(right?1:0),6,dt);heading+=steer*dt*(.25+Math.abs(speed)/32);car.rotation.y=heading;car.position.x-=Math.sin(heading)*speed*dt*.52;car.position.z-=Math.cos(heading)*speed*dt*.52;
for(const v of traffic){advanceTraffic(v,dt);v.hitCooldown=Math.max(0,v.hitCooldown-dt);v.speed=THREE.MathUtils.damp(v.speed,v.baseSpeed,.35,dt)}
const info=nearestInfo();
const offRoad=info.distance>7.1;
if(offRoad){speed=THREE.MathUtils.damp(speed,Math.sign(speed)*Math.min(Math.abs(speed),6),2.4,dt)}
for(const v of traffic){const dx=car.position.x-v.group.position.x,dz=car.position.z-v.group.position.z;if(dx*dx+dz*dz<13.5&&v.hitCooldown<=0){speed*=.48;v.speed=Math.max(7,v.speed*.58);v.hitCooldown=1.15;collisionFlash=.45}}
collisionFlash=Math.max(0,collisionFlash-dt);
const desired=new THREE.Vector3(car.position.x+Math.sin(heading)*14,8.5,car.position.z+Math.cos(heading)*14);camera.position.lerp(desired,1-Math.exp(-3.2*dt));camera.lookAt(car.position.x-Math.sin(heading)*8,1.6,car.position.z-Math.cos(heading)*8);
let junction='No junction nearby',junctionDist=Infinity;for(const [id,p] of Object.entries(nodes)){const d=Math.hypot(car.position.x-p[0],car.position.z-p[2]);if(d<junctionDist){junctionDist=d;junction=id}}if(junctionDist>38)junction='No junction nearby';else junction='Junction '+junction+' · '+Math.round(junctionDist)+' m';
document.getElementById('speed').textContent=Math.round(Math.abs(speed)*2.1);document.getElementById('road').textContent=info.distance<20?info.road.name:'Off road';document.getElementById('junction').textContent=junction;document.getElementById('traffic').textContent=traffic.length;document.getElementById('drivingState').textContent=collisionFlash>0?'Collision':offRoad?'Off road':'On road';document.getElementById('status').textContent=collisionFlash>0?'Collision · speed reduced':offRoad?'Off road · reduced traction':'Independent test · Production unchanged';drawMap();renderer.render(scene,camera)}
tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
