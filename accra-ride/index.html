<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10283b"><title>AccraRide | Bliss Innovation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142534;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.chip{background:#10283be8;border:1px solid #ffffff25;border-radius:12px;padding:7px 10px;font-size:11px;box-shadow:0 3px 12px #0003}.chip b{display:block;font-size:16px}.brand{font-weight:900;letter-spacing:.5px}.brand small{display:block;font-size:9px;color:#c0d1dc;font-weight:500}.trip{position:fixed;top:68px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:11px;background:#10283be8;border:1px solid #ffffff20;text-align:center;font-size:10px;min-width:165px;pointer-events:none}.trip b{display:block;font-size:13px}.controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;padding:0 14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.pedals{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}.btn{width:58px;height:60px;border:1px solid #ffffff55;border-radius:15px;background:#10283be8;color:white;font-size:24px;font-weight:900;box-shadow:0 4px 0 #0004;touch-action:none;user-select:none}.btn:active{filter:brightness(1.3)}.brake{width:76px;height:43px;background:#9c3030;font-size:12px}.gas{width:86px;height:62px;background:#13865a;font-size:12px}#notice{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);background:#10283bef;border:1px solid #ffffff22;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;display:none;text-align:center;max-width:90vw;white-space:nowrap}#cover{position:fixed;inset:0;background:#061522b8;display:flex;align-items:center;justify-content:center;padding:20px}#intro{width:min(350px,100%);background:#10283b;border:1px solid #ffffff25;border-radius:21px;padding:24px;text-align:center;box-shadow:0 15px 70px #0008}#intro h1{font-size:29px;margin:5px 0}#intro p{font-size:13px;line-height:1.5;color:#c5d4df}#start{width:100%;padding:14px;border:0;border-radius:13px;background:#159866;color:white;font-weight:900;font-size:15px;margin-top:8px}.small{font-size:11px;color:#a8c1d2;margin-top:13px}
</style></head><body><canvas id="scene"></canvas>
<div class="hud"><div class="chip brand">BLISS INNOVATION<small>ACCRARIDE · CITY DRIVER</small></div><div style="display:flex;gap:6px"><div class="chip">SPEED<b><span id="speed">0</span> km/h</b></div><div class="chip">COINS<b>🪙 <span id="coins">20</span></b></div></div></div>
<div class="trip">YOUR TRIP<b id="destination">Kaneshie → Achimota</b><span id="tripnote">Keep left • Drive carefully</span></div><div id="notice"></div>
<div class="controls"><div class="group"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="pedals"><button class="btn brake" id="brake">BRAKE</button><button class="btn gas" id="gas">ACCELERATE ▲</button></div></div>
<div id="cover"><div id="intro"><div style="font-size:38px">🚕</div><h1>AccraRide</h1><p>A calmer, clearer road view with two-way city traffic, traffic lights and motorbikes. Collisions cost coins.</p><button id="start">START DRIVING</button><div class="small">Steer with ◀ ▶ · Hold accelerate · Stop at red lights</div></div></div>
<script>
(()=>{const canvas=document.getElementById('scene'),g=canvas.getContext('2d'),$=id=>document.getElementById(id);let W=innerWidth,H=innerHeight,D=1,active=false,last=0,clock=0,roadScroll=0,speed=0,steer=0,coins=20,elapsed=0,trip=0,hitCooldown=0,lightClock=0,light='green',noticeTime=0;let cars=[],bikes=[];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function road(y){let p=clamp((y-H*.2)/(H*.9),0,1);return{cx:W*.5+Math.sin(roadScroll*.00035)*W*.008,half:W*(.105+p*.34),p}}function xLane(l,y){let r=road(y);return r.cx+(((l+.5)/4)-.5)*r.half*1.56}function say(s){$('notice').textContent=s;$('notice').style.display='block';noticeTime=2.3}function addCar(y,l){cars.push({y,l,color:['#e9ecef','#d64b43','#d8ad36','#317da5','#586d7a','#252e37'][Math.floor(Math.random()*6)],kind:Math.random()<.16?'van':Math.random()<.5?'taxi':'car',v:20+Math.random()*12})}function addBike(y,l){bikes.push({y,l,color:['#f0c443','#f1f2f4','#d74b40','#37a87a'][Math.floor(Math.random()*4)],v:28+Math.random()*10})}function reset(){cars=[];bikes=[];for(let i=0;i<7;i++)addCar(-.15-i*.21,Math.floor(Math.random()*4));for(let i=0;i<3;i++)addBike(-.25-i*.38,Math.random()<.5?0:1);speed=0;steer=0;coins=20;elapsed=0;roadScroll=0;lightClock=0;light='green';$('coins').textContent=coins}
function rounded(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function building(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);g.fillStyle='#f2d49b';for(let yy=y+7;yy<y+h-3;yy+=12)for(let xx=x+5;xx<x+w-3;xx+=10)g.fillRect(xx,yy,4,4)}
function drawCar(x,y,p,color,kind,player=false){g.save();g.translate(x,y);let s=player?.78:(.34+p*.65);g.scale(s,s);g.fillStyle='#0004';g.beginPath();g.ellipse(0,16,22,8,0,0,Math.PI*2);g.fill();g.fillStyle='#151a20';g.fillRect(-18,-13,6,17);g.fillRect(12,-13,6,17);g.fillRect(-18,9,6,16);g.fillRect(12,9,6,16);g.fillStyle=color;g.beginPath();g.roundRect(-15,-25,30,48,5);g.fill();g.fillStyle='#183144';g.beginPath();g.moveTo(-11,-17);g.lineTo(11,-17);g.lineTo(9,-3);g.lineTo(-9,-3);g.closePath();g.fill();g.fillStyle='#91bacb';g.fillRect(-9,-15,18,9);g.fillStyle='#263c4b';g.fillRect(-9,1,18,9);g.fillStyle='#f8edc7';g.fillRect(-13,17,5,3);g.fillRect(8,17,5,3);g.fillStyle='#d43d38';g.fillRect(-13,-24,5,4);g.fillRect(8,-24,5,4);if(kind==='taxi'||player){g.fillStyle='#f6dc60';g.fillRect(-5,-30,10,5)}g.restore()}
function drawBike(x,y,p,color){g.save();g.translate(x,y);let s=.4+p*.5;g.scale(s,s);g.strokeStyle='#222b32';g.lineWidth=3;g.beginPath();g.arc(-8,8,5,0,7);g.arc(8,8,5,0,7);g.stroke();g.strokeStyle='#d5e0e4';g.beginPath();g.moveTo(-8,8);g.lineTo(-1,0);g.lineTo(8,8);g.lineTo(4,-1);g.stroke();g.fillStyle=color;g.fillRect(-3,-7,9,7);g.fillStyle='#c99e7e';g.beginPath();g.arc(0,-11,4,0,7);g.fill();g.fillStyle='#1d2c38';g.fillRect(-5,-15,10,3);g.restore()}
function drawSignal(x,y,state,p){let s=.45+p*.5;g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#343b3f';g.fillRect(-2,0,4,65);rounded(-10,-27,20,43,5,'#20262b');['red','amber','green'].forEach((q,i)=>{g.beginPath();g.arc(0,-18+i*13,4,0,7);g.fillStyle=state===q?({red:'#ff3838',amber:'#ffc53c',green:'#39e68a'}[q]):'#50585d';g.fill()});g.restore()}
function draw(){g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#8ac8e8');sky.addColorStop(1,'#e5d9bd');g.fillStyle=sky;g.fillRect(0,0,W,H*.5);g.fillStyle='#fff8';g.beginPath();g.arc(W*.78,H*.12,20,0,7);g.fill();
// restrained skyline, not buildings on every step
for(let i=0;i<9;i++){let bw=W*(.035+(i%3)*.012),x=i*W/8-(roadScroll*.018%30),bh=H*(.08+(i*13%8)/100);building(x,H*.43-bh,bw,bh,['#9caaad','#bd9f80','#879b9b'][i%3])}g.fillStyle='#9ba59a';g.fillRect(0,H*.43,W,H*.57);
let top=road(H*.19),bot=road(H*1.1);g.fillStyle='#b6b4a1';g.beginPath();g.moveTo(top.cx-top.half-15,H*.19);g.lineTo(top.cx+top.half+15,H*.19);g.lineTo(bot.cx+bot.half+24,H*1.1);g.lineTo(bot.cx-bot.half-24,H*1.1);g.closePath();g.fill();g.fillStyle='#373d42';g.beginPath();g.moveTo(top.cx-top.half,H*.19);g.lineTo(top.cx+top.half,H*.19);g.lineTo(bot.cx+bot.half,H*1.1);g.lineTo(bot.cx-bot.half,H*1.1);g.closePath();g.fill();
// four lanes, two directions, restrained lane markings
for(let j=1;j<4;j++){for(let y=H*.2+(roadScroll%(H*.16))-H*.16;y<H*1.1;y+=H*.16){let r=road(y),x=r.cx-r.half+2*r.half*j/4;g.strokeStyle=j===2?'#e6c24e':'#eeeade';g.lineWidth=j===2?2:1.5;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+H*.06*clamp(y/H,.3,1));g.stroke()}}
for(let y=H*.2+(roadScroll%(H*.16))-H*.16;y<H*1.1;y+=H*.16){let r=road(y);g.strokeStyle='#e8c64d';g.lineWidth=1.5;g.beginPath();g.moveTo(r.cx-2,y);g.lineTo(r.cx-2,y+H*.04);g.moveTo(r.cx+2,y);g.lineTo(r.cx+2,y+H*.04);g.stroke()}
// occasional roadside details only
for(let i=0;i<4;i++){let y=H*(.27+((i*.31+roadScroll*.00016)%1)*.7),r=road(y),side=i%2?-1:1,x=r.cx+side*(r.half+W*(.04+r.p*.06));if(i%2===0){g.fillStyle='#614a35';g.fillRect(x-2,y-13*r.p,4,21*r.p);g.fillStyle='#367751';g.beginPath();g.arc(x,y-19*r.p,9*r.p+3,0,7);g.fill()}else if(r.p>.2)building(x-8*r.p,y-25*r.p,18*r.p+5,27*r.p+5,'#c69a70')}
// traffic light at periodic junction, not at every location
let phase=roadScroll%1800;if(phase>1000&&phase<1440){let jy=H*(.2+(phase-1000)/440*.53),r=road(jy);g.strokeStyle='#e9e8df';g.lineWidth=2;g.beginPath();g.moveTo(r.cx-r.half,jy+5);g.lineTo(r.cx+r.half,jy+5);g.stroke();for(let k=0;k<9;k++){g.fillStyle='#deddd4';g.fillRect(r.cx-r.half*.72+k*r.half*1.44/8,jy-2,3,Math.max(3,H*.014))}drawSignal(r.cx-r.half*.78,jy-H*.065,light,r.p);drawSignal(r.cx+r.half*.78,jy-H*.065,light,r.p);if(jy>H*.45&&jy<H*.73){g.fillStyle=light==='red'?'#ff5b5b':light==='amber'?'#ffd05b':'#6bf1a5';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(light==='red'?'RED LIGHT — STOP':light==='amber'?'AMBER — SLOW':'GREEN — PROCEED',W*.5,jy-H*.09)}}
// cars sorted by depth; same-lane spacing is managed in update
for(let v of [...cars].sort((a,b)=>a.y-b.y)){if(v.y<-.15||v.y>1.18)continue;let y=H*(.19+v.y*.91);drawCar(xLane(v.l,y),y,road(y).p,v.color,v.kind)}for(let b of bikes){if(b.y<-.1||b.y>1.15)continue;let y=H*(.19+b.y*.91);drawBike(xLane(b.l,y)+road(y).half*.07,y,road(y).p,b.color)}
drawCar(W*.5+steer*W*.23,H*.82,1,'#f2c442','taxi',true)}
function update(dt){if(!active)return;elapsed+=dt;roadScroll+=speed*dt*4.5;lightClock+=dt;if(lightClock>8){lightClock=0;light=light==='green'?'amber':light==='amber'?'red':'green'}
// Follow-distance control stops vehicles stacking on top of one another
for(let v of cars){let ahead=cars.filter(o=>o!==v&&o.l===v.l&&o.y<v.y&&v.y-o.y<.2).sort((a,b)=>b.y-a.y)[0];let pace=v.v;if(ahead){let gap=v.y-ahead.y;pace=Math.min(pace,ahead.v,Math.max(0,(gap-.085)*120))}v.y+=dt*(.06+pace*.0015);if(v.y>1.17){v.y=-.12-Math.random()*.55;v.l=Math.floor(Math.random()*4);v.v=18+Math.random()*15;v.color=['#e9ecef','#d64b43','#d8ad36','#317da5','#586d7a'][Math.floor(Math.random()*5)];v.kind=Math.random()<.16?'van':Math.random()<.5?'taxi':'car'}}
for(let b of bikes){let ahead=cars.find(v=>v.l===b.l&&v.y<b.y&&b.y-v.y<.1);if(ahead)b.v=Math.min(b.v,ahead.v);b.y+=dt*(.08+b.v*.0015);if(b.y>1.16){b.y=-.25-Math.random()*.6;b.l=Math.random()<.5?0:1;b.v=27+Math.random()*12}}
let phase=roadScroll%1800;if(phase>1290&&phase<1390&&light==='red'&&speed>35&&hitCooldown<=0){coins=Math.max(0,coins-1);$('coins').textContent=coins;hitCooldown=1.6;say('Red-light violation: −1 coin')}
let px=W*.5+steer*W*.23,py=H*.82;if(hitCooldown>0)hitCooldown-=dt;
if(hitCooldown<=0){for(let v of cars){let y=H*(.19+v.y*.91),x=xLane(v.l,y);if(Math.abs(y-py)<H*.055&&Math.abs(x-px)<W*.065){coins=Math.max(0,coins-1);$('coins').textContent=coins;hitCooldown=1.5;speed*=.45;v.y=-.2;say('Car collision: −1 coin');break}}}
if(hitCooldown<=0){for(let b of bikes){let y=H*(.19+b.y*.91),x=xLane(b.l,y)+road(y).half*.07;if(Math.abs(y-py)<H*.05&&Math.abs(x-px)<W*.06){coins=Math.max(0,coins-1);$('coins').textContent=coins;hitCooldown=1.5;speed*=.5;b.y=-.3;say('Motorbike collision: −1 coin');break}}}
if(noticeTime>0)noticeTime-=dt;else $('notice').style.display='none';if(elapsed>50){elapsed=0;trip++;coins+=3;$('coins').textContent=coins;$('destination').textContent=trip%2?'Achimota → Circle':'Circle → Kaneshie';$('tripnote').textContent='Trip complete • Continue safely';say('Trip completed: +3 coins')}
$('speed').textContent=Math.round(speed);draw()}
function frame(t){let dt=last?Math.min(.05,(t-last)/1000):.016;last=t;if(active)update(dt);else draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
let left=false,right=false,gas=false,brake=false;function hold(id,set){let e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();set(true);try{e.setPointerCapture(ev.pointerId)}catch{}});['pointerup','pointercancel','lostpointercapture'].forEach(n=>e.addEventListener(n,ev=>{ev.preventDefault();set(false)}))}hold('left',v=>left=v);hold('right',v=>right=v);hold('gas',v=>gas=v);hold('brake',v=>brake=v);function drive(){if(active){if(left)steer=clamp(steer-.035,-1,1);if(right)steer=clamp(steer+.035,-1,1);speed=gas?Math.min(90,speed+.5):Math.max(0,speed-.12);if(brake)speed=Math.max(0,speed-1.35);let phase=roadScroll%1800;if(light==='red'&&speed<4&&phase>1170&&phase<1300&&Math.random()<.006){coins++;$('coins').textContent=coins;say('Safe stop: +1 coin')}}requestAnimationFrame(drive)}requestAnimationFrame(drive);$('start').addEventListener('click',()=>{reset();active=true;$('cover').style.display='none';say('Keep left • Brake at red lights')});
})();
</script></body></html>
